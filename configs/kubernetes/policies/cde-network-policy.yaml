# PCI DSS network segmentation for the CDE namespace (Requirement 1). Default deny, then explicit allows.
# Ports and CIDRs are assumed: Aurora is 5432; the VPC CIDR is 10.0.0.0/16 in Mumbai (10.1.0.0/16 in Hyderabad).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: paysecure-cde
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tokenisation-ingress
  namespace: paysecure-cde
spec:
  podSelector:
    matchLabels:
      app: tokenisation-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paysecure
          podSelector:
            matchLabels:
              app: transaction-processor
      ports:
        - protocol: TCP
          port: 50051 # gRPC, assumed
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cde-egress
  namespace: paysecure-cde
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16 # Aurora and VPC endpoints (KMS, Secrets Manager); use the DR VPC CIDR in Hyderabad
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15017
