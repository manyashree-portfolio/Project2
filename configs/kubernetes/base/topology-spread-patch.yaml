# Strategic-merge patch applied through kustomize: spread each critical service across the 3 AZs
# so the loss of one AZ removes at most about a third of its pods (RB-10 improvement action).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: paysecure
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: payment-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-processor
  namespace: paysecure
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: transaction-processor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection
  namespace: paysecure
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: fraud-detection
