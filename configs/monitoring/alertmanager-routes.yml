# Alertmanager routing. PagerDuty is a third-party processor outside the India boundary, so payloads are
# limited to alarm name, severity, component and a short summary: never transaction, merchant or payer data
# (docs/07-data-sovereignty/compliance-matrix.md Section 6, item 6).
route:
  receiver: slack-platform
  group_by: [alertname, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="P1"]
      receiver: pagerduty-p1
      group_wait: 10s
      repeat_interval: 30m
    - matchers: [severity="P2"]
      receiver: pagerduty-p2
    - matchers: [drill="true"]
      receiver: slack-platform   # drill incidents never page real on-call escalation policies

receivers:
  - name: pagerduty-p1
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-p1
        severity: critical
        description: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.component }})"
        details:
          summary: "{{ .CommonAnnotations.summary }}"
  - name: pagerduty-p2
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-p2
        severity: warning
        description: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.component }})"
        details:
          summary: "{{ .CommonAnnotations.summary }}"
  - name: slack-platform
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook
        channel: "#platform-alerts"
        title: "{{ .CommonLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}"

inhibit_rules:
  # When the composite DR alert is firing, do not also page for each component
  - source_matchers: [alertname="DrReadinessDegraded"]
    target_matchers: [component=~"aurora|dynamodb|redis|msk|s3"]
    equal: []
